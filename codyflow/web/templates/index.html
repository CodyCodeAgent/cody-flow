<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodyFlow - AI 工作流编排</title>
<link rel="stylesheet" href="/static/css/main.css?v=4">
</head>
<body>
<div id="app">
  <app-header
    :current-page="currentPage"
    :current-flow-id="store.currentFlowId"
    :flow-name="store.flow.name"
    @navigate="navigate"
    @new-flow="newFlow"
    @save="saveFlow"
    @export-yaml="exportYAML"
    @import-yaml="showImportYamlDialog"
    @load-template="loadTemplate"
  ></app-header>

  <!-- Editor Page -->
  <div class="editor-outer" v-show="currentPage === 'editor'">
    <div class="editor-layout">
      <node-palette
        @add-node="addNodeAtCenter"
        @load-flow="loadFlow"
        @new-flow="newFlow"
        @delete-flow="deleteSidebarFlow"
      ></node-palette>
      <flow-canvas
        ref="canvas"
        :nodes="store.flow.nodes"
        :edges="store.flow.edges"
        :selected-node="store.selectedNode"
        :selected-edge-idx="store.selectedEdgeIdx"
        :run-status="'idle'"
        :running-nodes="[]"
        :completed-nodes="[]"
        :scale="store.canvasScale"
        :offset-x="store.canvasOffsetX"
        :offset-y="store.canvasOffsetY"
        @select-node="store.selectedNode = $event; store.selectedEdgeIdx = null"
        @select-edge="store.selectedEdgeIdx = $event; store.selectedNode = null"
        @update-node-pos="updateNodePos"
        @add-edge="addEdge"
        @remove-edge="removeEdge"
        @drop-node="handleDropNode"
        @update-transform="updateTransform"
      ></flow-canvas>
      <props-panel
        :node="selectedNodeData"
        :selected-edge="selectedEdgeData"
        :edges="store.flow.edges"
        @update="updateNodeProp"
        @rename="renameNode"
        @remove="removeNode"
        @update-edge="updateEdge"
        @remove-edge="removeEdgeByIdx"
      ></props-panel>
    </div>
  </div>

  <!-- Tasks Page -->
  <div v-show="currentPage === 'tasks'" style="height:calc(100vh - 56px);overflow:auto">
    <task-list @open-task="openTask"></task-list>
  </div>

  <!-- Task Detail Page -->
  <div v-show="currentPage === 'task-detail'" class="editor-outer">
    <task-detail @back="backToTasks"></task-detail>
  </div>

  <!-- Settings Page -->
  <settings-page
    v-show="currentPage === 'settings'"
    :config="store.config"
    :env-status="store.envStatus"
    @save-config="saveConfig"
    @check-env="checkEnvironment"
  ></settings-page>

  <!-- Import YAML Modal -->
  <div class="modal-overlay" v-if="store.showImportDialog" @click.self="store.showImportDialog=false">
    <div class="modal">
      <h3>导入 Flow YAML</h3>
      <div class="form-group">
        <label>粘贴 YAML 内容</label>
        <textarea rows="12" v-model="store.importYamlContent" placeholder="name: my-flow&#10;nodes:&#10;  - id: code&#10;    type: code&#10;..." style="font-family:monospace;font-size:11px"></textarea>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
        <button class="btn btn-outline btn-sm" @click="store.showImportDialog=false">取消</button>
        <button class="btn btn-primary btn-sm" @click="doImportYaml">导入</button>
      </div>
    </div>
  </div>

  <!-- Template Selection Modal -->
  <div class="modal-overlay" v-if="store.showTemplateDialog" @click.self="store.showTemplateDialog=false">
    <div class="modal">
      <h3>选择模板</h3>
      <p v-if="store.templates.length === 0" style="color:var(--text2);padding:16px 0;text-align:center">
        没有可用的模板
      </p>
      <div v-else class="flow-list">
        <div v-for="t in store.templates" :key="t.filename" class="flow-list-item" @click="doLoadTemplate(t.filename)">
          <div class="flow-list-name">{{ t.name }}</div>
          <div class="flow-list-meta">
            {{ t.description || '无描述' }}
            <span class="flow-list-info">{{ t.node_count }} 个节点</span>
          </div>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:12px">
        <button class="btn btn-outline btn-sm" @click="store.showTemplateDialog=false">关闭</button>
      </div>
    </div>
  </div>

  <!-- YAML Export Modal -->
  <div class="modal-overlay" v-if="showYamlModal" @click.self="showYamlModal=false">
    <div class="modal">
      <h3>导出 YAML</h3>
      <p style="font-size:12px;color:var(--text2);margin-bottom:8px">复制此 YAML 分享给其他人，他们可以通过"导入"功能加载。</p>
      <pre>{{ yamlContent }}</pre>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
        <button class="btn btn-outline btn-sm" @click="copyYaml">复制</button>
        <button class="btn btn-outline btn-sm" @click="showYamlModal=false">关闭</button>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="/static/js/store.js?v=4"></script>
<script src="/static/js/api.js?v=4"></script>
<script src="/static/components/header.js?v=4"></script>
<script src="/static/components/node-palette.js?v=4"></script>
<script src="/static/components/flow-canvas.js?v=4"></script>
<script src="/static/components/props-panel.js?v=4"></script>
<script src="/static/components/settings.js?v=4"></script>
<script src="/static/components/bottom-panel.js?v=4"></script>
<script src="/static/components/task-list.js?v=4"></script>
<script src="/static/components/task-detail.js?v=4"></script>
<script src="/static/js/app.js?v=4"></script>
</body>
</html>
