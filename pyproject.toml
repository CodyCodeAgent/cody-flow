[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codyflow"
version = "0.1.0"
description = "AI workflow orchestration framework with visual flow editor"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "langgraph>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
cody = ["cody-ai>=2.0"]
claude = ["claude-agent-sdk>=0.1"]
all = ["cody-ai>=2.0", "claude-agent-sdk>=0.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
codyflow = "codyflow.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["codyflow"]
