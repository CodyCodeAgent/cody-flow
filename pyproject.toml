[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codyflow"
version = "0.1.0"
description = "AI workflow orchestration framework with configurable nodes and runners"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
    "langgraph>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
]

[project.optional-dependencies]
cody = ["cody-ai>=2.0"]
claude = ["claude-agent-sdk>=0.1"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
all = ["cody-ai>=2.0", "claude-agent-sdk>=0.1", "fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
codyflow = "codyflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["codyflow"]
