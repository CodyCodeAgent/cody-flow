[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codyflow"
version = "0.1.0"
description = "AI workflow orchestration framework with visual flow editor"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "CodyFlow Contributors" },
]
keywords = [
    "ai",
    "workflow",
    "orchestration",
    "langgraph",
    "agent",
    "automation",
    "flow-editor",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: FastAPI",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
    "langgraph>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
cody = ["cody-ai>=2.0"]
claude = ["claude-agent-sdk>=0.1"]
all = ["cody-ai>=2.0", "claude-agent-sdk>=0.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/codycodeagent/cody-flow"
Repository = "https://github.com/codycodeagent/cody-flow"
Issues = "https://github.com/codycodeagent/cody-flow/issues"
Changelog = "https://github.com/codycodeagent/cody-flow/blob/main/CHANGELOG.md"

[project.scripts]
codyflow = "codyflow.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["codyflow"]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # ternary operator
]

[tool.ruff.lint.isort]
known-first-party = ["codyflow"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
